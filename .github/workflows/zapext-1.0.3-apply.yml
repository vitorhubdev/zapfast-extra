name: Apply ZapExt 1.0.3

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Prepare ZapExt 1.0.3 packaging fix'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply ZapExt 1.0.3 packaging changes
        run: python3 .github/scripts/apply-zapext-1.0.3.py
      - name: Validate packaging identity
        run: |
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          import plistlib
          import yaml

          assert 'pub const ZAPEXT_VERSION: &str = "1.0.3";' in Path('src/updates.rs').read_text()
          main = Path('src/main.rs').read_text()
          assert 'assert_eq!(APP_VERSION, "1.0.3");' in main
          assert 'ZapExt - 1.0.3' in main

          iss = Path('packaging/windows/zapfast.iss').read_text()
          assert '#define AppName "ZapExt"' in iss
          assert 'AppId={{F2512314-384A-4002-9933-AB840FD01639}' in iss
          assert '#define AppExeName "zapfast.exe"' in iss
          assert 'vitorhubdev/zapfast-extra' in iss

          with open('packaging/macos/Info.plist', 'rb') as source:
              plist = plistlib.load(source)
          assert plist['CFBundleName'] == 'ZapExt'
          assert plist['CFBundleDisplayName'] == 'ZapExt'
          assert plist['CFBundleIdentifier'] == 'me.paolino.fastsapp'
          assert plist['CFBundleExecutable'] == 'zapfast'
          assert 'ZapExt' in plist['NSMicrophoneUsageDescription']
          assert 'ZapExt.app' in Path('packaging/macos/verify.sh').read_text()
          assert '"-volname", "ZapExt"' in Path('packaging/macos/dmg.rb').read_text()
          assert 'dist/macos-input/ZapExt.app' in Path('.github/workflows/release.yml').read_text()

          desktop = Path('packaging/applications/zapfast.desktop').read_text()
          assert 'Name=ZapExt' in desktop
          assert 'Exec=zapfast' in desktop
          meta = Path('packaging/flatpak/rocks.zapfast.ZapFast.metainfo.xml').read_text()
          assert '<id>rocks.zapfast.ZapFast</id>' in meta
          assert '<name>ZapExt</name>' in meta
          assert 'vitorhubdev/zapfast-extra' in meta

          config = yaml.safe_load(Path('native-packages.yaml').read_text())
          assert config['nfpm']['name'] == 'zapfast'
          assert config['release']['repository'] == 'vitorhubdev/zapfast-extra'
          assert config['targets']['macos-universal']['native']['output'] == 'zapfast-@TAG@-macos-universal.dmg'
          assert config['assets']['SOURCE']['url'].startswith('https://github.com/vitorhubdev/zapfast-extra/')
          PY
      - name: Commit ZapExt 1.0.3
        run: |
          git config user.name "Vitor"
          git config user.email "108148783+vitorhubdev@users.noreply.github.com"
          git rm .github/scripts/apply-zapext-1.0.3.py
          git rm .github/workflows/zapext-1.0.3-apply.yml
          git add -A
          git commit -m "Release ZapExt 1.0.3 packaging identity"
          git push origin main
