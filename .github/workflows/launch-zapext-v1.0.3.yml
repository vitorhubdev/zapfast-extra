name: Launch ZapExt v1.0.3

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

jobs:
  launch:
    if: github.event.head_commit.message == 'Launch ZapExt v1.0.3'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Create v1.0.3 tag
        run: |
          set -euo pipefail
          target="80c22c2c759bb3d53e6c21b7f91a8eb53c9b6dbb"
          test "$(git rev-parse "$target")" = "$target"
          test "$(git show "$target:src/updates.rs" | grep -c 'pub const ZAPEXT_VERSION: &str = "1.0.3";')" = "1"
          if git ls-remote --exit-code --tags origin refs/tags/v1.0.3 >/dev/null 2>&1; then
            test "$(git ls-remote --tags origin refs/tags/v1.0.3 | awk '{print $1}')" = "$target"
          else
            git tag v1.0.3 "$target"
            git push origin refs/tags/v1.0.3
          fi
      - name: Dispatch official release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --ref v1.0.3
