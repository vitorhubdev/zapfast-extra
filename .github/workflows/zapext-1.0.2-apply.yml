name: Apply ZapExt 1.0.2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Prepare ZapExt 1.0.2 patch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply ZapExt 1.0.2 changes
        run: |
          python3 .github/scripts/apply-zapext-1.0.2.py
          python3 .github/scripts/finalize-zapext-1.0.2.py
      - name: Format
        run: |
          cargo fmt --all
          cargo fmt --all --check
      - name: Commit ZapExt 1.0.2
        run: |
          git config user.name "Vitor"
          git config user.email "108148783+vitorhubdev@users.noreply.github.com"
          git rm .github/scripts/apply-zapext-1.0.2.py
          git rm .github/scripts/finalize-zapext-1.0.2.py
          git rm .github/workflows/zapext-1.0.2-apply.yml
          git add -A
          git commit -m "Release ZapExt 1.0.2 fixes"
          git push origin main
