name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Baked into the binary by settings.rs; releases built without the
  # secret simply ship keyless and the picker asks for one.
  ZAPFAST_GIPHY_KEY: ${{ secrets.ZAPFAST_GIPHY_KEY || secrets.FASTSAPP_GIPHY_KEY }}

jobs:
  preflight:
    name: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Version, tag, and immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/release-preflight.sh "$GITHUB_REF_NAME"
          if gh release view "$GITHUB_REF_NAME" --json isDraft > "$RUNNER_TEMP/rel.json" 2>/dev/null; then
            if [[ "$(jq -r .isDraft "$RUNNER_TEMP/rel.json")" == "true" ]]; then
              state=draft
            else
              state=published
            fi
          else
            state=absent
          fi
          bash scripts/release-draft-policy.sh "$state"
          echo "ZAPEXT_RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "ZAPEXT_GIT_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"

  build:
    name: build (${{ matrix.target }})
    needs: preflight
    runs-on: ${{ matrix.os }}
    env:
      ZAPEXT_GIT_SHA: ${{ github.sha }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          # A native arm64 runner, so the GUI's system libraries need no
          # cross-compilation sysroot.
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          # Cross-compiled from x64: the MSVC arm64 linker ships with the
          # runner's Visual Studio.
          - os: windows-latest
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
      - name: Validate ZapExt release version
        shell: bash
        run: bash scripts/release-preflight.sh "$GITHUB_REF_NAME"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # The repository pins its toolchain; add the cross-target's standard
      # library to the toolchain the pin actually resolves to.
      - run: rustup target add ${{ matrix.target }}
      - name: GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev libasound2-dev cmake perl
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Candidate or stable version for this tag
        shell: bash
        run: echo "ZAPEXT_RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Prove this binary was compiled from the tag commit
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/zapext"
          if [ "${{ runner.os }}" = "Windows" ]; then bin="$bin.exe"; fi
          bash scripts/release-origin.sh "$GITHUB_SHA" "$bin"

      - name: Package
        shell: bash
        run: |
          name="zapfast-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/zapext.exe" "dist/$name/"
            case "${{ matrix.target }}" in
              x86_64-*) portable_arch="x64" ;; 
              aarch64-*) portable_arch="arm64" ;; 
              *) portable_arch="${{ matrix.target }}" ;; 
            esac
            cp "target/${{ matrix.target }}/release/zapext.exe" \
              "dist/ZapExt-${GITHUB_REF_NAME}-windows-${portable_arch}-portable.exe"
          else
            cp "target/${{ matrix.target }}/release/zapext" "dist/$name/"
          fi
          cp README.md LICENSE packaging/zapfast-portable.txt "dist/$name/"
          if [ "${{ runner.os }}" = "Linux" ]; then
            # Desktop integration for package builds and hand-installs.
            cp --parents packaging/applications/zapfast.desktop packaging/icons/zapfast.svg contrib/omarchy/zapfast.json.tpl contrib/omarchy/zapfast-theme "dist/$name/"
          fi
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$name.zip" "$name"
          else
            tar czf "$name.tar.gz" "$name"
          fi
          printf '%s\n' "$GITHUB_SHA" > "release-commit-${{ matrix.target }}.txt"

      # Inno Setup ships with the runner image. PowerShell, because bash on
      # Windows rewrites /D... arguments as paths.
      - name: Installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          $numericVersion = $version.Split('-')[0]
          $arch = "${{ matrix.target }}".Split("-")[0]
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DVersion=$version" "/DNumericVersion=$numericVersion" "/DArch=$arch" `
            "/DBinary=$PWD\target\${{ matrix.target }}/release/zapext.exe" `
            "/DOutputDir=$PWD\dist" packaging\windows\zapfast.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*-setup.exe
            dist/*-portable.exe
            dist/release-commit-*.txt
          if-no-files-found: error

  macos:
    name: macOS universal app
    needs: preflight
    runs-on: macos-latest
    env:
      ZAPEXT_GIT_SHA: ${{ github.sha }}
      # Complete Apple credentials enable native-packages signing/notarization.
      APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-universal

      - name: Candidate or stable version for this tag
        run: echo "ZAPEXT_RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Build both architectures
        run: |
          cargo build --locked --release --target aarch64-apple-darwin
          cargo build --locked --release --target x86_64-apple-darwin

      - name: Universal binary
        run: |
          mkdir -p universal
          lipo -create \
            target/aarch64-apple-darwin/release/zapext \
            target/x86_64-apple-darwin/release/zapext \
            -output universal/zapext
          bash scripts/release-origin.sh "$GITHUB_SHA" universal/zapext

      # Making the disk image needs room, and nothing after this point reads
      # the build tree or the toolchains a macOS runner carries for other
      # languages.
      - name: Free disk space
        run: |
          df -h /
          rm -rf target
          sudo rm -rf /Users/runner/Library/Android/sdk
          sudo rm -rf /usr/local/share/dotnet /Users/runner/.dotnet
          sudo rm -rf /Library/Frameworks/Mono.framework
          rm -rf "$HOME/Library/Caches/Homebrew"
          df -h /

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
      - name: Install native packaging
        run: gem install native-packages --version 0.6.0 --no-document

      - name: App bundle
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist/macos-input
          bash packaging/macos/bundle.sh universal/zapext dist/macos-input/ZapExt.app "$version"
          cp README.md LICENSE dist/macos-input/

      - name: Package, sign and notarize macOS app
        run: |
          native-packages build \
            --version "${GITHUB_REF_NAME#v}" --target macos-universal --defer-recipes \
            --output "$RUNNER_TEMP/macos-packages"
          cp "$RUNNER_TEMP/macos-packages/packages/macos-universal/dmg/"*.dmg dist/

      - name: Verify the macOS release app
        run: |
          mode=adhoc
          if [[ -n "${APPLE_CERTIFICATE_P12:-}" \
             && -n "${APPLE_CERTIFICATE_PASSWORD:-}" \
             && -n "${APPLE_SIGNING_IDENTITY:-}" \
             && -n "${APPLE_ID:-}" \
             && -n "${APPLE_TEAM_ID:-}" \
             && -n "${APPLE_APP_PASSWORD:-}" ]]; then
            mode=notarized
          fi
          bash packaging/macos/verify.sh \
            "dist/zapfast-${GITHUB_REF_NAME}-macos-universal.dmg" "$mode"
          printf '%s\n' "$GITHUB_SHA" > dist/release-commit-macos.txt

      - uses: actions/upload-artifact@v7
        with:
          name: macos-universal
          path: |
            dist/*.dmg
            dist/release-commit-macos.txt
          if-no-files-found: error

  # The Linux build packaged as a Flatpak bundle: the same binary, in the
  # sandbox packaging/flatpak describes, so nothing compiles twice. Flathub
  # builds from source on its own machines, from the manifest beside it.
  flatpak:
    name: Flatpak bundle
    needs: build
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: x86_64-unknown-linux-gnu
          path: dist
      - name: Unpack the Linux build
        run: |
          tar xzf dist/zapfast-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu.tar.gz -C packaging/flatpak
          mv packaging/flatpak/zapfast-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu packaging/flatpak/built
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/rocks.zapfast.ZapFast.bundle.yml
          bundle: zapfast-${{ github.ref_name }}-x86_64.flatpak
          cache: false
          upload-artifact: false
      - name: Stamp this commit
        run: printf '%s\n' "$GITHUB_SHA" > release-commit-flatpak.txt
      - uses: actions/upload-artifact@v7
        with:
          name: flatpak
          path: |
            *.flatpak
            release-commit-flatpak.txt
          if-no-files-found: error

  publish:
    name: Draft GitHub release
    needs: [build, flatpak, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Bind checksums to this commit
        run: bash scripts/release-bind.sh dist "$GITHUB_SHA" "$GITHUB_REF_NAME"
      - uses: softprops/action-gh-release@v2
        with:
          name: ZapExt ${{ github.ref_name }}
          body: |
            Draft built from `${{ github.sha }}`. Checksums in checksums.txt are for this commit only. This draft stays unpublished until the packages are complete and a person publishes it.
          files: dist/*
          draft: true
          generate_release_notes: false
          prerelease: ${{ contains(github.ref_name, '-rc.') }}
          make_latest: false

  packaging:
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    needs: publish
    uses: ./.github/workflows/packaging.yml
    with:
      version: ${{ github.ref_name }}
      # Build and install-check native packages from the archives whose
      # binaries already contain this tag's commit. Do not publish them:
      # the GitHub release stays a draft until a person publishes it.
      publish: false
    secrets: inherit
