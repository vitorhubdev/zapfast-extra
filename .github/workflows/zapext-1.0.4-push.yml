name: Prepare ZapExt 1.0.4 source

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/zapext-1.0.4-push.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt

      - name: Install icon tooling
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Teach finalizer to read chunked logo source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/finalize-zapext-1.0.4.py')
          text = path.read_text(encoding='utf-8')
          old = '''source_b64 = ROOT / ".github/scripts/zapext-logo.webp.b64"
          source = ROOT / ".zapext-logo-source.webp"
          source.write_bytes(base64.b64decode(source_b64.read_text(encoding="utf-8").strip()))'''
          new = '''source_parts = sorted((ROOT / ".github/scripts").glob("zapext-logo.[0-9][0-9].b64"))
          if not source_parts:
              raise SystemExit("ZapExt logo source chunks are missing")
          encoded_logo = "".join(part.read_text(encoding="utf-8").strip() for part in source_parts)
          source = ROOT / ".zapext-logo-source.webp"
          source.write_bytes(base64.b64decode(encoded_logo, validate=True))'''
          if old not in text:
              raise SystemExit('logo loader block not found')
          text = text.replace(old, new, 1)
          old_cleanup = '''source_b64.unlink(missing_ok=True)
          (ROOT / ".github/scripts/finalize-zapext-1.0.4.py").unlink(missing_ok=True)'''
          new_cleanup = '''for part in source_parts:
              part.unlink(missing_ok=True)
          (ROOT / ".github/scripts/zapext-logo.webp.b64").unlink(missing_ok=True)
          (ROOT / ".github/scripts/finalize-zapext-1.0.4.py").unlink(missing_ok=True)'''
          if old_cleanup not in text:
              raise SystemExit('logo cleanup block not found')
          path.write_text(text.replace(old_cleanup, new_cleanup, 1), encoding='utf-8')
          PY

      - name: Apply ZapExt 1.0.4 changes
        run: |
          python3 .github/scripts/apply-zapext-1.0.4.py
          python3 .github/scripts/finalize-zapext-1.0.4.py

      - name: Update icon contract test for Z+ artwork
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/util.rs')
          text = path.read_text(encoding='utf-8')
          old = '''    #[test]
              fn icon_is_opaque_in_the_middle_and_clear_at_the_corners() {
                  let icon = app_icon_rgba(32);
                  assert_eq!(icon[3], 0);
                  let middle = (16 * 32 + 16) * 4;
                  assert_eq!(icon[middle + 3], 255);
              }'''.replace('              ', '    ')
          new = '''    #[test]
              fn icon_has_clear_corners_and_visible_interior() {
                  let icon = app_icon_rgba(32);
                  assert_eq!(icon[3], 0);
                  assert_eq!(icon[((31 * 32 + 31) * 4) + 3], 0);

                  let mut visible_pixels = 0usize;
                  let mut max_alpha = 0u8;
                  for y in 4..28 {
                      for x in 4..28 {
                          let alpha = icon[((y * 32 + x) * 4) + 3];
                          max_alpha = max_alpha.max(alpha);
                          if alpha >= 32 {
                              visible_pixels += 1;
                          }
                      }
                  }
                  assert!(max_alpha >= 64, "icon interior is too transparent");
                  assert!(visible_pixels >= 32, "icon interior has too little visible coverage");
              }'''.replace('              ', '    ')
          if old not in text:
              raise SystemExit('old icon test block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Preserve workflow files for connector-managed update
        run: git restore --source=HEAD -- .github/workflows

      - name: Validate and push source changes
        run: |
          cargo fmt --all
          cargo fmt --all --check
          bash -n packaging/macos/verify.sh
          test "$(cat VERSION)" = "1.0.4"
          grep -q 'vitorhubdev/zapfast-extra/releases/latest' src/updates.rs
          test -s assets/zapext.png
          test -s packaging/windows/zapfast.ico
          test -s packaging/macos/icon-1024.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Release ZapExt 1.0.4"
          git push origin main
