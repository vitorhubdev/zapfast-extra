# Shared CLI: gem install native-packages --version 0.6.0
---
schema: 1
tool:
  version: 0.6.0
  nfpm: 2.47.0
# Ubuntu 24.04 and Debian 13 use ALSA's t64 package name.
libraries:
  libasound.so.2:
    deb: libasound2t64
    rpm: alsa-lib
nfpm:
  name: vespera
  maintainer: vitorhubdev <108148783+vitorhubdev@users.noreply.github.com>
  homepage: https://github.com/vitorhubdev/zapfast-extra
  description: Vespera, a community fork of ZapFast with extra desktop features and fixes
  license: MIT
  contents:
  - src: "@PAYLOAD@/vespera-v@VERSION@-@TARGET@/vespera"
    dst: "/usr/bin/vespera"
    file_info:
      mode: 493
  - src: "@PAYLOAD@/vespera-v@VERSION@-@TARGET@/LICENSE"
    dst: "/usr/share/licenses/vespera/LICENSE"
    file_info:
      mode: 420
  - src: "@PAYLOAD@/vespera-v@VERSION@-@TARGET@/README.md"
    dst: "/usr/share/doc/vespera/README.md"
    file_info:
      mode: 420
  - src: "@PAYLOAD@/vespera-v@VERSION@-@TARGET@/packaging/applications/vespera.desktop"
    dst: "/usr/share/applications/vespera.desktop"
    file_info:
      mode: 420
  - src: "@PAYLOAD@/vespera-v@VERSION@-@TARGET@/packaging/icons/vespera.svg"
    dst: "/usr/share/icons/hicolor/scalable/apps/vespera.svg"
    file_info:
      mode: 420
  - src: contrib/omarchy/vespera.json.tpl
    dst: /usr/share/vespera/omarchy/vespera.json.tpl
    file_info:
      mode: 420
  - src: contrib/omarchy/vespera-theme
    dst: /usr/share/vespera/omarchy/vespera-theme
    file_info:
      mode: 493
  overrides:
    deb:
      depends:
      - libc6 (>= 2.39)
      - libgl1
      - libegl1
      - libxkbcommon0
      - libxkbcommon-x11-0
      - libwayland-client0
      - libwayland-cursor0
      - libwayland-egl1
      - libx11-6
      - libx11-xcb1
      - libxcursor1
      - libxi6
      - libxrandr2
      - libasound2t64
      - libasound2-plugins
      - libgcc-s1
      - libstdc++6
    rpm:
      depends:
      - glibc >= 2.39
      - libglvnd-glx
      - libglvnd-egl
      - libxkbcommon
      - libxkbcommon-x11
      - libwayland-client
      - libwayland-cursor
      - libwayland-egl
      - libX11
      - libX11-xcb
      - libXcursor
      - libXi
      - libXrandr
      - alsa-lib
      - alsa-plugins-pulseaudio
      - libgcc
      - libstdc++
  rpm:
    buildhost: github-actions
targets:
  macos-universal:
    platform: macos
    arch: universal
    formats: [dmg]
    input:
      kind: directory
      local: dist/macos-input
    native:
      command: [ruby, packaging/macos/dmg.rb, '@PAYLOAD@', '@PACKAGE@']
      output: 'vespera-@TAG@-macos-universal.dmg'
  linux-amd64:
    platform: linux
    arch: amd64
    libc: glibc
    compiler_target: x86_64-unknown-linux-gnu
    formats:
    - deb
    - rpm
    input:
      local: dist/vespera-v@VERSION@-x86_64-unknown-linux-gnu.tar.gz
      release_asset: vespera-v@VERSION@-x86_64-unknown-linux-gnu.tar.gz
  linux-arm64:
    platform: linux
    arch: arm64
    libc: glibc
    compiler_target: aarch64-unknown-linux-gnu
    formats:
    - deb
    - rpm
    input:
      local: dist/vespera-v@VERSION@-aarch64-unknown-linux-gnu.tar.gz
      release_asset: vespera-v@VERSION@-aarch64-unknown-linux-gnu.tar.gz
release:
  repository: vitorhubdev/zapfast-extra
  checksums: checksums.txt
assets:
  AMD64:
    file: vespera-v@VERSION@-x86_64-unknown-linux-gnu.tar.gz
    local: dist/vespera-v@VERSION@-x86_64-unknown-linux-gnu.tar.gz
  ARM64:
    file: vespera-v@VERSION@-aarch64-unknown-linux-gnu.tar.gz
    local: dist/vespera-v@VERSION@-aarch64-unknown-linux-gnu.tar.gz
  MACOS:
    file: vespera-v@VERSION@-macos-universal.dmg
    local: dist/vespera-v@VERSION@-macos-universal.dmg
  SOURCE:
    file: vespera-@VERSION@.tar.gz
    url: https://github.com/vitorhubdev/zapfast-extra/archive/refs/tags/v@VERSION@.tar.gz
    checksummed: false
    local: dist/vespera-@VERSION@.tar.gz
templates:
  homebrew/vespera.rb: packaging/homebrew/vespera.rb.in
  arch/vespera/PKGBUILD: packaging/arch/vespera/PKGBUILD.in
  arch/vespera/vespera.install: packaging/arch/vespera.install
  arch/vespera-bin/PKGBUILD: packaging/arch/vespera-bin/PKGBUILD.in
  arch/vespera-bin/vespera-bin.install: packaging/arch/vespera.install
  arch/vespera-git/PKGBUILD: packaging/arch/vespera-git/PKGBUILD.in
  arch/vespera-git/vespera-git.install: packaging/arch/vespera.install
repositories:
  # Fork note: upstream Homebrew/AUR destinations belong to crmne/zapfast and
  # are not published by this fork. Homebrew points at a fork-owned tap
  # placeholder; AUR entries are kept for template reference only. Releases
  # publish GitHub assets; downstream publishing requires fork-owned secrets.
  homebrew:
    url: https://github.com/vitorhubdev/homebrew-tap.git
    push_url: https://github.com/vitorhubdev/homebrew-tap.git
    branch: main
    package_path: Casks
    files:
      homebrew/vespera.rb: Casks/vespera.rb
    version_file: Casks/vespera.rb
    version_pattern: 'version "([^"]+)"'
    publish: push
  aur-source:
    group: aur
    url: https://aur.archlinux.org/vespera.git
    push_url: ssh://aur@aur.archlinux.org/vespera.git
    branch: master
    package_path: "."
    files:
      arch/vespera: "."
    version_file: ".SRCINFO"
    version_pattern: "^\\s*pkgver = (\\S+)"
    publish: push
  aur-bin:
    group: aur
    url: https://aur.archlinux.org/vespera-bin.git
    push_url: ssh://aur@aur.archlinux.org/vespera-bin.git
    branch: master
    package_path: "."
    files:
      arch/vespera-bin: "."
    version_file: ".SRCINFO"
    version_pattern: "^\\s*pkgver = (\\S+)"
    publish: push
  aur-git:
    group: aur
    url: https://aur.archlinux.org/vespera-git.git
    push_url: ssh://aur@aur.archlinux.org/vespera-git.git
    branch: master
    package_path: "."
    files:
      arch/vespera-git: "."
    version_file: ".SRCINFO"
    version_pattern: "^\\s*pkgver = (\\S+)"
    publish: push
version_file: Cargo.toml
