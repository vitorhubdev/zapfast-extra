title: Vespera
vespera_version: "1.0.36"
release_asset_prefix: vespera
release_app_name: Vespera
description: Vespera, a community fork of ZapFast. A fast, native WhatsApp client for Linux, macOS, and Windows.
lang: en-US
timezone: Europe/Berlin
url: https://github.com/vitorhubdev/Vespera
baseurl: ""
logo: /assets/images/logo.svg
image: /screenshot.png

markdown: kramdown
kramdown:
  input: GFM

permalink: pretty
theme: jekyll-vitepress-theme

collections:
  guide:
    output: true
    permalink: "/:name/"
  reference:
    output: true
    permalink: "/:name/"

defaults:
  - scope:
      path: ""
    values:
      layout: default
      image: /screenshot.png
      topics:
        - WhatsApp client
        - Rust
        - egui
        - whatsapp-rust
        - Linux WhatsApp desktop
  - scope:
      type: guide
    values:
      layout: default
  - scope:
      type: reference
    values:
      layout: default

jekyll_vitepress:
  seo:
    page_type: TechArticle
    image:
      path: /screenshot.png
      alt: Vespera showing a chat with a photo, a voice message, a quoted reply, and a link preview
    publisher:
      type: Person
      name: vitorhubdev
      url: https://github.com/vitorhubdev/Vespera
      same_as:
        - https://github.com/vitorhubdev/Vespera
        - https://github.com/crmne/zapfast
  llms:
    title: Vespera
    description: >-
      Documentation for Vespera, a community fork of ZapFast: a native WhatsApp
      client for chats, voice messages, attachments, and notifications on
      Linux, macOS, and Windows.
    full: true
    details: >-
      Covers installation, phone linking, everyday use, settings, and the
      WhatsApp connection. Source is on
      [GitHub](https://github.com/vitorhubdev/Vespera).
  branding:
    site_title: Vespera
    logo:
      default: /assets/images/logo.svg
      alt: Vespera
  syntax:
    light_theme: github
    dark_theme: github.dark
  footer:
    enabled: true
    show_on_docs: false
    message: >-
      Maintained by <a href="https://github.com/vitorhubdev" target="_blank" rel="noreferrer">vitorhubdev</a> as a community mod of <a href="https://github.com/crmne/zapfast" target="_blank" rel="noreferrer">ZapFast</a> by Carmine Paolino. Upstream features by
    copyright: >-
      <span class="footer-brand-links"><a href="https://chatwithwork.com" class="footer-chatwithwork-link" target="_blank" rel="noreferrer"><img class="footer-chatwithwork-logo theme-image light" src="https://chatwithwork.com/logotype.svg" alt="Chat with Work"><img class="footer-chatwithwork-logo theme-image dark" src="https://chatwithwork.com/logotype-dark.svg" alt="Chat with Work"></a><a href="https://rubyllm.com" class="footer-rubyllm-link" target="_blank" rel="noreferrer"><img class="footer-rubyllm-logo theme-image light" src="https://rubyllm.com/assets/images/logotype.svg" alt="RubyLLM"><img class="footer-rubyllm-logo theme-image dark" src="https://rubyllm.com/assets/images/logotype_dark.svg" alt="RubyLLM"></a><a href="https://paolino.me/projects" target="_blank" rel="noreferrer" aria-label="More projects by Carmine Paolino">and more</a></span><br><span class="footer-built-with">Docs built with <a href="https://jekyll-vitepress.dev" target="_blank" rel="noreferrer">Jekyll VitePress</a>. Vespera is a community fork of ZapFast, MIT-licensed. Not affiliated with or endorsed by WhatsApp LLC or Meta. WhatsApp is a trademark of WhatsApp LLC.</span>
  doc_footer:
    enabled: true
    previous_label: Previous page
    next_label: Next page
  last_updated:
    enabled: true
    text: Last updated
    format: "%Y-%m-%d %H:%M"
  edit_link:
    enabled: true
    pattern: "https://github.com/vitorhubdev/Vespera/edit/main/docs/:path"
    text: Edit this page on GitHub
  github_star:
    enabled: true
    repository: vitorhubdev/Vespera
    text: Star
    show_count: true
  github_sponsor:
    enabled: false

plugins:
  - jekyll-redirect-from
  - jekyll-vitepress-theme

exclude:
  - _site
  - .jekyll-cache
  - .sass-cache
  - .bundle
  - vendor
  - Gemfile
  - Gemfile.lock
